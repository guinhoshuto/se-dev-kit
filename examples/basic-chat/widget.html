<main class="widget-shell" aria-label="Basic chat preview">
  <section id="chat-widget" class="chat-card" aria-live="polite" data-loaded="false">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <header class="chat-header">
      <div class="channel-mark" aria-hidden="true">
        <span id="channel-initials">ST</span>
      </div>
      <div class="channel-copy">
        <p class="eyebrow">Live community</p>
        <h1 id="card-title">Studio Chat</h1>
        <p class="channel-line">
          <span class="live-dot" aria-hidden="true"></span>
          <span id="channel-name">@streamer</span>
        </p>
      </div>
      <div class="live-badge">LIVE</div>
    </header>

    <div id="message-list" class="message-list" role="log" aria-label="Chat messages"></div>

    <footer class="chat-footer">
      <span class="footer-spark" aria-hidden="true">✦</span>
      <span id="footer-label">Synthetic preview data</span>
      <span id="message-count" class="message-count">0 messages</span>
    </footer>
  </section>
</main>
